version: 2

# Workflow actions are pinned to full commit SHAs so a moved tag can't change
# what CI executes — publish.yml in particular holds PyPI release rights. A pin
# only trades one risk for another unless something keeps it current, which is
# what this file is for: Dependabot rewrites the SHA and the trailing `# v4`
# comment together, so the pins stay both immutable and patched.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
